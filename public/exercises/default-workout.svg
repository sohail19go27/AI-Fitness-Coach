<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="512" height="512" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dumbbell icon -->
  <g transform="translate(156, 180)">
    <!-- Left weight -->
    <rect x="0" y="40" width="40" height="80" rx="8" fill="#64748b"/>
    <!-- Bar -->
    <rect x="40" y="70" width="120" height="20" rx="4" fill="#94a3b8"/>
    <!-- Right weight -->
    <rect x="160" y="40" width="40" height="80" rx="8" fill="#64748b"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#cbd5e1" text-anchor="middle">
    Workout Exercise
  </text>
  <text x="256" y="350" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">
    Click Generate to load image
  </text>
</svg>
